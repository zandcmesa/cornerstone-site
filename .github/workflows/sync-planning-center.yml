name: Sync Planning Center

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/sync-pco.js
        env:
          PCO_APP_ID: ${{ secrets.PCO_APP_ID }}
          PCO_SECRET: ${{ secrets.PCO_SECRET }}
      - name: Commit if changed
        run: |
          git config user.name "planning-center-sync"
          git config user.email "sync@users.noreply.github.com"
          git add js/pco-data.js
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Sync events and groups from Planning Center"
          git push
