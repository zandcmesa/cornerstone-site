# Runs on the Mac mini. Never add pull_request triggers to a self-hosted workflow.
name: Check YouTube access

on:
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
    inputs:
      video:
        description: YouTube video id to test against. Defaults to a known past replay.
        required: false

jobs:
  check:
    runs-on: [self-hosted, macOS, sermon-mini]
    timeout-minutes: 10
    env:
      PATH: /opt/homebrew/bin:/usr/bin:/bin
    steps:
      - name: Pull 20 seconds of real video
        continue-on-error: true
        run: |
          rm -f /tmp/check.mp4
          yt-dlp --remote-components ejs:npm \
            -f 'bv*[height<=480][ext=mp4]/bv*[ext=mp4]/b[ext=mp4]/b' \
            --download-sections '*120-140' --force-keyframes-at-cuts \
            --no-progress -o /tmp/check.mp4 \
            "https://www.youtube.com/watch?v=${{ inputs.video || 'EJQj-0P4fxs' }}" 2>&1 | tail -20

      - name: Report
        run: |
          if [ -s /tmp/check.mp4 ]; then
            echo "## ✅ YouTube access is working" >> $GITHUB_STEP_SUMMARY
            echo "Pulled $(stat -f%z /tmp/check.mp4) bytes. Monday's cut should run fine." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ YouTube access is blocked" >> $GITHUB_STEP_SUMMARY
            echo "The mini could not reach YouTube. Check that the runner is online and run \`brew upgrade yt-dlp\` on the mini." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
